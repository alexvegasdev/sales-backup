<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Exportador de Datos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>📦 Exportador de Datos</h1>
    <form method="POST">
      <label for="month">Mes:</label>
      <select name="month" id="month" required>
        {% for m in range(1, 13) %}
          <option value="{{ "%02d"|format(m) }}">{{ "%02d"|format(m) }}</option>
        {% endfor %}
      </select>

      <label for="year">Año:</label>
      <select name="year" id="year" required>
        {% for y in range(2022, 2031) %}
          <option value="{{ y }}">{{ y }}</option>
        {% endfor %}
      </select>

      <button type="submit">Generar Exportación</button>
    </form>

    <h2>📄 Archivos Exportados</h2>
    <ul class="backup-list">
      {% for file in backups %}
        <li>
          {{ file }}
          <a href="{{ url_for('download_file', filename=file) }}" class="download-btn">Descargar</a>
        </li>
      {% else %}
        <li>No hay archivos exportados todavía.</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
